      - name: Check NativeAOT warning baseline
        shell: pwsh
        env:
          AOT_DIAGNOSTIC_ALLOWLIST_PATH: ${{ inputs.aot_diagnostic_allowlist_path }}
          AOT_NONREPOSITORY_OWNERSHIP_PATH: ${{ inputs.aot_nonrepository_ownership_path }}
        run: |
          $baseline = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/NativeAotWarningBaseline.txt'
          $report = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/nativeaot-warning-report.json'
          if ([string]::IsNullOrWhiteSpace($env:REFLECTION_NATIVEAOT_DIAGNOSTIC_CONTEXT)) { throw 'NativeAOT diagnostic context was not exported by the publish step.' }
          $arguments = @(
            '-LogPath', $env:REFLECTION_NATIVEAOT_LOG,
            '-BaselinePath', $baseline,
            '-OutputPath', $report,
            '-DiagnosticContext', $env:REFLECTION_NATIVEAOT_DIAGNOSTIC_CONTEXT,
            '-SymbolMapPath', $env:REFLECTION_NATIVEAOT_SYMBOL_MAP)
          $diagnosticBaseline = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/NativeAotRepositoryDiagnosticBaseline.20261013.json'
          $manualDispatch = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $allowRepositoryFingerprintDrift = ('${{ inputs.allow_aot_repository_fingerprint_drift }}' -eq 'true') -or ($manualDispatch -and '${{ inputs.strict_aot_repository_fingerprints }}' -eq 'false')
          if (Test-Path -LiteralPath $diagnosticBaseline -PathType Leaf) {
            $arguments += @('-DiagnosticBaselinePath', $diagnosticBaseline)
            if (!$allowRepositoryFingerprintDrift) { $arguments += '-FailOnNewRepositoryDiagnostic' }
          } elseif (!$allowRepositoryFingerprintDrift) {
            throw "Checked-in NativeAOT repository fingerprint baseline was not found: $diagnosticBaseline"
          }
          if ('${{ inputs.strict_aot_warnings }}' -eq 'true') { $arguments += '-FailOnNewWarning' }
          $allowUnparsedDiagnostics = ('${{ inputs.allow_unparsed_aot_diagnostics }}' -eq 'true') -or ($manualDispatch -and '${{ inputs.strict_aot_unparsed }}' -eq 'false')
          if (!$allowUnparsedDiagnostics) { $arguments += '-FailOnUnparsedDiagnostic' }
          $allowlistPath = ([string]$env:AOT_DIAGNOSTIC_ALLOWLIST_PATH).Trim()
          if ([string]::IsNullOrWhiteSpace($allowlistPath)) {
            $allowlistPath = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/NativeAotRepositoryDiagnosticAllowlist.20261013.json'
          }
          $allowRepositoryWarningDrift = ('${{ inputs.allow_aot_repository_warning_drift }}' -eq 'true') -or ($manualDispatch -and '${{ inputs.strict_aot_repository_warnings }}' -eq 'false')
          if (Test-Path -LiteralPath $allowlistPath -PathType Leaf) {
            $arguments += @('-DiagnosticAllowlistPath', $allowlistPath)
            if (!$allowRepositoryWarningDrift) { $arguments += '-FailOnUnapprovedRepositoryDiagnostic' }
          } elseif (!$allowRepositoryWarningDrift) {
            throw "NativeAOT diagnostic allowlist was not found: $allowlistPath"
          }
          $nonRepositoryOwnershipPath = ([string]$env:AOT_NONREPOSITORY_OWNERSHIP_PATH).Trim()
          if ([string]::IsNullOrWhiteSpace($nonRepositoryOwnershipPath)) {
            $nonRepositoryOwnershipPath = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/NativeAotNonRepositoryDiagnosticOwnership.json'
          }
          $allowNonRepositoryDiagnosticDrift = '${{ inputs.allow_aot_nonrepository_diagnostic_drift }}' -eq 'true'
          if (Test-Path -LiteralPath $nonRepositoryOwnershipPath -PathType Leaf) {
            $arguments += @('-NonRepositoryOwnershipPath', $nonRepositoryOwnershipPath)
            if (!$allowNonRepositoryDiagnosticDrift) { $arguments += '-FailOnUnownedNonRepositoryDiagnostic' }
          } elseif (!$allowNonRepositoryDiagnosticDrift) {
            throw "NativeAOT non-repository ownership manifest was not found: $nonRepositoryOwnershipPath"
          }
          & ./benchmarks/ReflectionTrimProbe/Check-NativeAotWarnings.ps1 @arguments
          if (-not $?) { throw 'NativeAOT warning baseline check failed.' }

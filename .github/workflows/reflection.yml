          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native'
          $sdkVersion = (& dotnet --version).Trim()
          if ($sdkVersion -ne '8.0.425') { throw "NativeAOT reflection validation requires SDK 8.0.425, but the active SDK is $sdkVersion." }
          $diagnosticContext = @(
            "sdk=$sdkVersion"
            'tfm=net8.0'
            'rid=win-x64'
            'trim=partial'
            'aot=true'
            'mode=ci-single-publish'

           $deepDiamondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-deep-diamond'
           $wideDeepDiamondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-wide-deep-diamond'
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependency, $transitiveDependency) -OutputDirectory $firstTarget
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath $dependencyV2 -OutputDirectory $secondTarget
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependency, $transitiveDependencyVariant) -OutputDirectory $duplicateTarget
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependencyVariant, $transitiveDependency) -OutputDirectory $directVariantTarget
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $diamondPlugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependency, $secondaryDependency, $transitiveDependency) -OutputDirectory $diamondTarget
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependencyVariant, $transitiveDependencyVariant) -OutputDirectory $mixedVariantTarget
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $diamondPlugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependency, $secondaryDependency, $deepTransitiveDependency, $deepDependency) -OutputDirectory $deepDiamondTarget
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $tripleDiamondPlugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependency, $secondaryDependency, $tertiaryDependency, $deepTransitiveDependency, $deepDependency) -OutputDirectory $wideDeepDiamondTarget
      - name: Execute concurrent third-party plugin versions on NativeAOT host output
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimThirdPartyPluginProbe/bin/Release/net8.0/ReflectionTrimThirdPartyPluginProbe.dll'
          $firstTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-v1'
          $secondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-v2'
          & dotnet $probe --multi-version $firstTarget $secondTarget
          if ($LASTEXITCODE -ne 0) { throw "Concurrent third-party plugin versions on NativeAOT host failed with exit code $LASTEXITCODE" }
      - name: Execute concurrent third-party plugin dependency matrix on NativeAOT host output
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimThirdPartyPluginProbe/bin/Release/net8.0/ReflectionTrimThirdPartyPluginProbe.dll'
          $firstTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-v1'
          $secondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-v2'
          $strongNameTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-strong-name-conflict'
          $duplicateTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-v1-variant'
          $directVariantTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-v1-direct-variant'
          $diamondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-diamond'
          $mixedVariantTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-mixed-variant'
          $deepDiamondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-deep-diamond'
          $wideDeepDiamondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-wide-deep-diamond'
          $multiPluginRounds = 3
          $multiPluginRoundsText = ([string]$env:REFLECTION_MULTI_PLUGIN_ROUNDS).Trim()
          if ([string]::IsNullOrWhiteSpace($multiPluginRoundsText) -or
              ![int]::TryParse($multiPluginRoundsText, [Globalization.NumberStyles]::Integer, [Globalization.CultureInfo]::InvariantCulture, [ref]$multiPluginRounds) -or
              $multiPluginRounds -lt 1 -or
              $multiPluginRounds -gt 20) {
            throw 'multi_plugin_rounds must be an integer from 1 through 20.'
          }
          & dotnet $probe --multi-plugin-rounds $multiPluginRounds $firstTarget $secondTarget $strongNameTarget $duplicateTarget $directVariantTarget $diamondTarget $mixedVariantTarget $deepDiamondTarget $wideDeepDiamondTarget
          if ($LASTEXITCODE -ne 0) { throw "Concurrent dependency graph rounds on NativeAOT host failed with exit code $LASTEXITCODE" }
          & ./benchmarks/ReflectionTrimThirdPartyPluginProbe/Test-MultiPluginCapacity.ps1 -ProbePath $probe -Rounds 3 -ValidPluginDirectories @(
            $firstTarget,
            $secondTarget,
            $strongNameTarget,
            $duplicateTarget,
            $directVariantTarget,
            $diamondTarget,
            $mixedVariantTarget,
            $deepDiamondTarget,
            $wideDeepDiamondTarget
          )
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT multi-plugin capacity boundary failed with exit code $LASTEXITCODE" }
          & ./benchmarks/ReflectionTrimThirdPartyPluginProbe/Test-MultiPluginLongRounds.ps1 -ProbePath $probe -Rounds 10 -PluginDirectories @(
            $firstTarget,
            $secondTarget,
            $strongNameTarget,
            $duplicateTarget,
            $directVariantTarget,
            $diamondTarget,
            $mixedVariantTarget,
            $deepDiamondTarget,
            $wideDeepDiamondTarget
          )
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT multi-plugin long-round boundary failed with exit code $LASTEXITCODE" }
      - name: Execute runtime circular resolver boundary on NativeAOT host output
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimThirdPartyPluginProbe/bin/Release/net8.0/ReflectionTrimThirdPartyPluginProbe.dll'
          $firstTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-v1'
          $secondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/win-x64/native-third-party-plugin-multi-version-v1-variant'
          & dotnet $probe --runtime-cycle $firstTarget $secondTarget
          if ($LASTEXITCODE -ne 0) { throw "Runtime circular resolver boundary on NativeAOT host output failed with exit code $LASTEXITCODE" }
      - name: Publish NativeAOT trim-capable external plugin host
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.UnrootedModelsHost/ReflectionTrimProbe.UnrootedModelsHost.csproj'
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.UnrootedModelsHost/bin/Release/net8.0/win-x64/publish-nativeaot'
          dotnet restore $project -r win-x64 -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=full
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT trim-capable external plugin host restore failed with exit code $LASTEXITCODE" }
          dotnet publish $project -c Release -f net8.0 -r win-x64 --self-contained true -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=full -p:DebugType=None --no-restore "-p:PublishDir=$publishDir/"
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT trim-capable external plugin host publish failed with exit code $LASTEXITCODE" }
          $hostExecutable = Join-Path $publishDir 'ReflectionTrimProbe.UnrootedModelsHost.exe'
          if (!(Test-Path -LiteralPath $hostExecutable -PathType Leaf)) { throw "NativeAOT trim-capable external plugin host output was not created: $hostExecutable" }
      - name: Execute NativeAOT member-trimmed external plugin host
        shell: pwsh
        run: |
          $hostExecutable = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.UnrootedModelsHost/bin/Release/net8.0/win-x64/publish-nativeaot/ReflectionTrimProbe.UnrootedModelsHost.exe'
          & $hostExecutable member-trimmed
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT member-trimmed external plugin host failed with exit code $LASTEXITCODE" }
      - name: Verify linker root preserve and multi-assembly modes on NativeAOT host
        shell: pwsh
        run: |
          $hostExecutable = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.UnrootedModelsHost/bin/Release/net8.0/win-x64/publish-nativeaot/ReflectionTrimProbe.UnrootedModelsHost.exe'
          $output = (& $hostExecutable --root-modes 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "NativeAOT linker root preserve/multi-assembly matrix failed with exit code $LASTEXITCODE" }
          if (!$output.Contains('reflection-plugin-constrained-generic-root-modes:verified', [System.StringComparison]::Ordinal)) { throw 'NativeAOT constrained generic root marker was not found.' }
      - name: Upload NativeAOT warning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-nativeaot-warnings-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reflection-nativeaot.log
            benchmarks/ReflectionTrimProbe/bin/nativeaot-warning-report.json
            benchmarks/ReflectionTrimProbe/bin/nativeaot-repository-fingerprint-baseline.json
            benchmarks/ReflectionTrimProbe/bin/nativeaot-source-map.json
            benchmarks/ReflectionTrimProbe/NativeAotWarningBaseline.txt
            benchmarks/ReflectionTrimProbe/NativeAotRepositoryDiagnosticBaseline.20261013.json
            benchmarks/ReflectionTrimProbe/NativeAotRepositoryDiagnosticAllowlist.20261013.json
            benchmarks/ReflectionTrimProbe/NativeAotNonRepositoryDiagnosticOwnership.json
          if-no-files-found: warn
      - name: Build reflection runtime inputs
        run: |
          dotnet build src/Bing.Utils/Bing.Utils.csproj -c Release -f net8.0
          dotnet build src/Bing.Utils.Reflection/Bing.Utils.Reflection.csproj -c Release -f net8.0
      - name: Execute reflection steady-state probe
        shell: pwsh
        run: |
          $core = Join-Path $env:GITHUB_WORKSPACE 'output/release/net8.0/Bing.Utils.dll'
          $reflection = Join-Path $env:GITHUB_WORKSPACE 'output/release/net8.0/Bing.Utils.Reflection.dll'
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionComparisonProbe/bin/Release/net8.0/ReflectionComparisonProbe.dll'
          foreach ($path in @($core, $reflection, $probe)) {
            if (!(Test-Path -LiteralPath $path)) { throw "Reflection probe input was not built: $path" }
          }
          & dotnet $probe $core $reflection --steady
          if ($LASTEXITCODE -ne 0) { throw "Reflection steady-state probe failed with exit code $LASTEXITCODE" }
      - name: Validate reflection cache inventory
        shell: pwsh
        run: |
          ./benchmarks/Bing.Utils.Benchmark/Test-ReflectionCacheInventory.ps1 -OutputPath benchmarks/Bing.Utils.Benchmark/bin/reflection-cache-inventory.json
      - name: Validate reflection external cache boundary
        shell: pwsh
        run: |
          ./benchmarks/Bing.Utils.Benchmark/Test-ReflectionExternalCacheBoundary.ps1 -OutputPath benchmarks/Bing.Utils.Benchmark/bin/reflection-external-cache-boundary.json
      - name: Execute reflection cache capacity probe
        shell: pwsh
        env:
          REFLECTION_CAPACITY_MAX_BYPASS: ${{ inputs.reflection_capacity_max_bypass }}
          REFLECTION_CAPACITY_MAX_TIME_US: ${{ inputs.reflection_capacity_max_time_us }}
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/Bing.Utils.Benchmark/bin/reflection-capacity-report.json'
          $arguments = @('--reflection-capacity', "--reflection-capacity-output=$report")
          foreach ($budget in @(
              @{ Name = 'REFLECTION_CAPACITY_MAX_BYPASS'; Parameter = '--reflection-capacity-max-bypass' },
              @{ Name = 'REFLECTION_CAPACITY_MAX_TIME_US'; Parameter = '--reflection-capacity-max-time-us' })) {
            $text = [string](Get-Item -Path ("Env:" + $budget.Name)).Value
            if ([string]::IsNullOrWhiteSpace($text)) { continue }
            $arguments += "$($budget.Parameter)=$($text.Trim())"
          }
          dotnet run --project benchmarks/Bing.Utils.Benchmark/Bing.Utils.Benchmark.csproj --no-build -c Release -f net8.0 -- @arguments
          if ($LASTEXITCODE -ne 0) { throw "Reflection capacity probe failed with exit code $LASTEXITCODE" }
      - name: Upload reflection capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-capacity-${{ github.run_id }}
          path: |
            benchmarks/Bing.Utils.Benchmark/bin/reflection-capacity-report.json
            benchmarks/Bing.Utils.Benchmark/bin/reflection-cache-inventory.json
            benchmarks/Bing.Utils.Benchmark/bin/reflection-external-cache-boundary.json
          if-no-files-found: warn
  baseline-comparison:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.baseline_ref != '' || inputs.comparison_rounds != '1' || inputs.cold_start_max_time_ns != '' || inputs.cold_start_max_bytes != '' || inputs.steady_state_max_time_ns != '' || inputs.steady_state_max_bytes != '' || inputs.performance_policy_path != ''))
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - name: Prime NuGet cache for snapshot restores
        run: dotnet restore benchmarks/ReflectionComparisonProbe/ReflectionComparisonProbe.csproj -p:TargetFrameworks=net8.0
      - name: Run BaselineRef comparison
        shell: pwsh
        env:
          BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline_ref }}
          COMPARISON_ROUNDS: ${{ inputs.comparison_rounds }}
          COLD_START_MAX_TIME_NS: ${{ inputs.cold_start_max_time_ns }}
          COLD_START_MAX_BYTES: ${{ inputs.cold_start_max_bytes }}
          STEADY_STATE_MAX_TIME_NS: ${{ inputs.steady_state_max_time_ns }}
          STEADY_STATE_MAX_BYTES: ${{ inputs.steady_state_max_bytes }}
          PERFORMANCE_POLICY_PATH: ${{ inputs.performance_policy_path }}
        run: |
          $baselineRef = $env:BASELINE_REF.Trim()
          if ([string]::IsNullOrWhiteSpace($baselineRef)) { throw 'baseline_ref must not be empty.' }
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionComparisonProbe/bin/ci-baseline-ref'
          $rounds = 3
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $roundsText = $env:COMPARISON_ROUNDS.Trim()
            if ([string]::IsNullOrWhiteSpace($roundsText) -or ![int]::TryParse($roundsText, [Globalization.NumberStyles]::Integer, [Globalization.CultureInfo]::InvariantCulture, [ref]$rounds) -or $rounds -lt 1 -or $rounds -gt 20) {
              throw 'comparison_rounds must be an integer from 1 through 20.'
            }
          }
          $arguments = @('-BaselineRef', $baselineRef, '-Rounds', $rounds, '-OutputDirectory', $evidence)
          foreach ($budget in @(
              @{ Name = 'COLD_START_MAX_TIME_NS'; Parameter = '-ColdStartMaxTimeNs' },
              @{ Name = 'COLD_START_MAX_BYTES'; Parameter = '-ColdStartMaxBytes' },
              @{ Name = 'STEADY_STATE_MAX_TIME_NS'; Parameter = '-SteadyStateMaxTimeNs' },
              @{ Name = 'STEADY_STATE_MAX_BYTES'; Parameter = '-SteadyStateMaxBytes' })) {
            $text = [string](Get-Item -Path ("Env:" + $budget.Name)).Value
            if ([string]::IsNullOrWhiteSpace($text)) { continue }
            try {
              $value = [double]::Parse($text.Trim(), [Globalization.CultureInfo]::InvariantCulture)
            } catch {
              throw "$($budget.Name) must be a finite non-negative number."
            }
            if ([double]::IsNaN($value) -or [double]::IsInfinity($value) -or $value -lt 0) {
              throw "$($budget.Name) must be a finite non-negative number."
            }
            $arguments += @($budget.Parameter, $value)
          }
          $policyText = $env:PERFORMANCE_POLICY_PATH.Trim()
          if (![string]::IsNullOrWhiteSpace($policyText)) {
            $workspaceRoot = ([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
            $policyPath = [IO.Path]::GetFullPath((Join-Path $workspaceRoot $policyText))
            if (!$policyPath.StartsWith($workspaceRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'performance_policy_path must stay under GITHUB_WORKSPACE.'
            }
            if (!(Test-Path -LiteralPath $policyPath -PathType Leaf)) {
              throw "performance_policy_path was not found under the repository: $policyText"
            }
            $resolvedPolicyPath = (Resolve-Path -LiteralPath $policyPath).Path
            if (!$resolvedPolicyPath.StartsWith($workspaceRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'performance_policy_path resolved outside GITHUB_WORKSPACE.'
            }
            $arguments += @('-PerformancePolicyPath', $resolvedPolicyPath)
          }
          & ./benchmarks/ReflectionComparisonProbe/Run-ReflectionComparison.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "BaselineRef comparison smoke failed with exit code $LASTEXITCODE" }
      - name: Upload BaselineRef comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-baseline-comparison-${{ github.run_id }}
          path: benchmarks/ReflectionComparisonProbe/bin/ci-baseline-ref
          if-no-files-found: error

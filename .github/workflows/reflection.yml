name: Reflection verification
on:
  pull_request:
    paths:
      - 'src/Bing.Utils/**'
      - 'src/Bing.Utils.Reflection/**'
      - 'tests/Bing.Utils.Tests/**'
      - 'tests/Bing.Utils.Reflection.Tests/**'
      - 'benchmarks/Bing.Utils.Benchmark/**'
      - 'benchmarks/ReflectionComparisonProbe/**'
      - 'benchmarks/ReflectionTrimProbe/**'
      - 'benchmarks/ReflectionTrimProbe.Models/**'
      - 'benchmarks/ReflectionTrimProbe.PluginModels/**'
      - 'benchmarks/ReflectionTrimProbe.TertiaryModels/**'
      - 'benchmarks/ReflectionTrimProbe.QuaternaryModels/**'
      - 'benchmarks/ReflectionTrimProbe.QuinaryModels/**'
      - 'benchmarks/ReflectionTrimProbe.RuntimeCycleFixtures/**'
      - 'benchmarks/ReflectionTrimProbe.UnrootedModels/**'
      - 'benchmarks/ReflectionTrimProbe.UnrootedModelsHost/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginModels/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependency/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependencyVariant/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginSecondaryDependency/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDiamondModels/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDeepDependency/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDeepTransitiveDependencyVariant/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTertiaryDependency/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTripleDiamondModels/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependencyVariant/**'
      - 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependencyV2/**'
      - 'benchmarks/ReflectionTrimProbe.StrongNameConflictDependency/**'
      - 'benchmarks/ReflectionTrimProbe.StrongNameConflictModels/**'
      - 'benchmarks/ReflectionTrimThirdPartyPluginProbe/**'
      - 'benchmarks/ReflectionTrimPluginLoadProbe/**'
      - 'docs/quality/reflection-*.md'
      - 'docs/quality/reflection-performance-policy.schema.json'
      - 'docs/quality/reflection-cache-inventory.json'
      - 'benchmarks/Bing.Utils.Benchmark/Test-ReflectionCacheInventory.ps1'
      - 'benchmarks/Bing.Utils.Benchmark/Test-ReflectionExternalCacheBoundary.ps1'
      - 'global.json'
      - '*.props'
      - '.github/workflows/reflection.yml'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional Git ref, tag, or commit SHA for a baseline comparison; required when comparison_rounds or a budget is supplied.'
        required: false
        default: ''
        type: string
      comparison_rounds:
        description: 'Manual comparison rounds (1-20), requires baseline_ref; pull requests always use three summary rounds.'
        required: false
        default: '1'
        type: string
      multi_plugin_rounds:
        description: 'Manual multi-plugin dependency graph rounds (1-20); pull requests default to three rounds.'
        required: false
        default: '3'
        type: string
      strict_aot_warnings:
        description: 'Fail the NativeAOT job when a warning ID is not in the checked-in baseline.'
        required: false
        default: false
        type: boolean
      strict_aot_unparsed:
        description: 'Legacy opt-out: set false to allow unparsed NativeAOT diagnostics during investigation; the default gate is enabled.'
        required: false
        default: true
        type: boolean
      allow_unparsed_aot_diagnostics:
        description: 'Allow unparsed NativeAOT diagnostics for an explicit diagnostic investigation run.'
        required: false
        default: false
        type: boolean
      strict_aot_repository_warnings:
        description: 'Legacy manual opt-out: set false to bypass the default repository diagnostic ownership allowlist gate.'
        required: false
        default: true
        type: boolean
      allow_aot_repository_warning_drift:
        description: 'Allow repository NativeAOT diagnostic ownership allowlist drift for an explicit diagnostic investigation run.'
        required: false
        default: false
        type: boolean
      allow_aot_nonrepository_diagnostic_drift:
        description: 'Allow unowned NativeAOT dependency, toolchain, generated, or unknown diagnostics for an explicit diagnostic investigation run.'
        required: false
        default: false
        type: boolean
      strict_aot_repository_fingerprints:
        description: 'Legacy opt-out: set false to allow repository diagnostic fingerprint drift during investigation; the default gate is enabled.'
        required: false
        default: true
        type: boolean
      allow_aot_repository_fingerprint_drift:
        description: 'Allow repository NativeAOT diagnostic fingerprint drift for an explicit diagnostic investigation run.'
        required: false
        default: false
        type: boolean
      aot_diagnostic_allowlist_path:
        description: 'Optional repository-relative NativeAOT diagnostic allowlist JSON; defaults to the checked-in reflection baseline.'
        required: false
        default: ''
        type: string
      aot_nonrepository_ownership_path:
        description: 'Optional repository-relative non-repository NativeAOT ownership manifest; defaults to the checked-in reflection manifest.'
        required: false
        default: ''
        type: string
      cold_start_max_time_ns:
        description: 'Optional candidate cold-start time budget in ns; requires baseline_ref.'
        required: false
        default: ''
        type: string
      cold_start_max_bytes:
        description: 'Optional candidate cold-start allocation budget in bytes; requires baseline_ref.'
        required: false
        default: ''
        type: string
      steady_state_max_time_ns:
        description: 'Optional candidate steady-state time budget in ns; requires baseline_ref.'
        required: false
        default: ''
        type: string
      steady_state_max_bytes:
        description: 'Optional candidate steady-state allocation budget in bytes; requires baseline_ref.'
        required: false
        default: ''
        type: string
      performance_policy_path:
        description: 'Optional repository-relative JSON performance policy; requires baseline_ref and enables an auditable explicit comparison gate.'
        required: false
        default: ''
        type: string
      reflection_capacity_max_bypass:
        description: 'Optional reflection capacity bypass budget; empty keeps structural-only validation.'
        required: false
        default: ''
        type: string
      reflection_capacity_max_time_us:
        description: 'Optional reflection capacity probe time budget in microseconds; empty keeps structural-only validation.'
        required: false
        default: ''
        type: string
jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net7.0, net6.0, net5.0, netcoreapp3.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.425
            7.0.x
            6.0.x
            5.0.x
            3.1.x
      - name: Verify legacy runtime availability
        if: matrix.tfm == 'net5.0' || matrix.tfm == 'netcoreapp3.1'
        shell: pwsh
        run: |
          $expectedPrefix = if ('${{ matrix.tfm }}' -eq 'net5.0') { '5.0.' } else { '3.1.' }
          $runtimeLines = & dotnet --list-runtimes
          $runtimeLine = $runtimeLines | Where-Object { $_ -match ('^Microsoft\.NETCore\.App\s+' + [regex]::Escape($expectedPrefix)) } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace([string]$runtimeLine)) {
            throw "Required legacy runtime Microsoft.NETCore.App $expectedPrefix* was not installed for ${{ matrix.tfm }}."
          }
          Write-Output ("legacy-runtime-available:${{ matrix.tfm }}:" + $runtimeLine)
      - name: Reflection module tests
        run: dotnet test tests/Bing.Utils.Reflection.Tests/Bing.Utils.Reflection.Tests.csproj -c Release -f ${{ matrix.tfm }}
      - name: Core reflection consumers
        run: dotnet test tests/Bing.Utils.Tests/Bing.Utils.Tests.csproj -c Release -f ${{ matrix.tfm }} --filter "FullyQualifiedName~Reflection"
      - name: Verify framework-dependent PublishTrimmed boundary
        if: matrix.tfm == 'net8.0'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/framework-dependent-trim-negative'
          $output = & dotnet publish benchmarks/ReflectionTrimProbe/ReflectionTrimProbe.csproj -c Release -f net8.0 -p:TargetFrameworks=net8.0 -p:PublishTrimmed=true -p:SelfContained=false -p:DebugType=None "-p:PublishDir=$publishDir" 2>&1
          $exitCode = $LASTEXITCODE
          $text = $output -join [Environment]::NewLine
          if ($exitCode -eq 0) { throw 'Framework-dependent PublishTrimmed unexpectedly succeeded; update the trim boundary contract.' }
          if ($text -notmatch 'NETSDK1102') { throw "Framework-dependent PublishTrimmed failed without NETSDK1102: $text" }
          Write-Output 'framework-dependent-publish-trimmed:unsupported-NETSDK1102'
  probes:
    runs-on: windows-latest
    env:
      REFLECTION_MULTI_PLUGIN_ROUNDS: ${{ inputs.multi_plugin_rounds || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - name: Build reflection benchmark tools
        run: dotnet build benchmarks/Bing.Utils.Benchmark/Bing.Utils.Benchmark.csproj -c Release -f net8.0
      - name: Build comparison probe
        run: dotnet build benchmarks/ReflectionComparisonProbe/ReflectionComparisonProbe.csproj -c Release
      - name: Build reflection plugin load probe
        run: dotnet build benchmarks/ReflectionTrimPluginLoadProbe/ReflectionTrimPluginLoadProbe.csproj -c Release -f net8.0
      - name: Build unrooted plugin model
        run: dotnet build benchmarks/ReflectionTrimProbe.UnrootedModels/ReflectionTrimProbe.UnrootedModels.csproj -c Release -f net8.0
      - name: Build quinary linker root model
        run: dotnet build benchmarks/ReflectionTrimProbe.QuinaryModels/ReflectionTrimProbe.QuinaryModels.csproj -c Release -f net8.0
      - name: Build non-trimmable third-party plugin transitive dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency.csproj -c Release -f net8.0
      - name: Build variant non-trimmable third-party plugin transitive dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependencyVariant/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependencyVariant.csproj -c Release -f net8.0
      - name: Build variant non-trimmable third-party plugin dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependencyVariant/ReflectionTrimProbe.NonTrimmablePluginDependencyVariant.csproj -c Release -f net8.0
      - name: Build non-trimmable third-party plugin secondary dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginSecondaryDependency/ReflectionTrimProbe.NonTrimmablePluginSecondaryDependency.csproj -c Release -f net8.0
      - name: Build diamond non-trimmable third-party plugin model
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginDiamondModels/ReflectionTrimProbe.NonTrimmablePluginDiamondModels.csproj -c Release -f net8.0
      - name: Build deep non-trimmable third-party plugin leaf dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginDeepDependency/ReflectionTrimProbe.NonTrimmablePluginDeepDependency.csproj -c Release -f net8.0
      - name: Build deep non-trimmable third-party plugin transitive dependency variant
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginDeepTransitiveDependencyVariant/ReflectionTrimProbe.NonTrimmablePluginDeepTransitiveDependencyVariant.csproj -c Release -f net8.0
      - name: Build non-trimmable third-party plugin tertiary dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginTertiaryDependency/ReflectionTrimProbe.NonTrimmablePluginTertiaryDependency.csproj -c Release -f net8.0
      - name: Build non-trimmable third-party triple diamond plugin model
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginTripleDiamondModels/ReflectionTrimProbe.NonTrimmablePluginTripleDiamondModels.csproj -c Release -f net8.0
      - name: Build version-conflicting third-party plugin dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependencyV2/ReflectionTrimProbe.NonTrimmablePluginDependencyV2.csproj -c Release -f net8.0
      - name: Build strong-name conflict dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.StrongNameConflictDependency/ReflectionTrimProbe.StrongNameConflictDependency.csproj -c Release -f net8.0
      - name: Build strong-name conflict plugin model
        run: dotnet build benchmarks/ReflectionTrimProbe.StrongNameConflictModels/ReflectionTrimProbe.StrongNameConflictModels.csproj -c Release -f net8.0
      - name: Build non-trimmable third-party plugin dependency
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependency/ReflectionTrimProbe.NonTrimmablePluginDependency.csproj -c Release -f net8.0
      - name: Build non-trimmable third-party plugin model
        run: dotnet build benchmarks/ReflectionTrimProbe.NonTrimmablePluginModels/ReflectionTrimProbe.NonTrimmablePluginModels.csproj -c Release -f net8.0
      - name: Build non-trimmable third-party plugin boundary probe
        run: dotnet build benchmarks/ReflectionTrimThirdPartyPluginProbe/ReflectionTrimThirdPartyPluginProbe.csproj -c Release -f net8.0
      - name: Build real AssemblyRef cycle fixture
        shell: pwsh
        run: |
          $fixtureOutput = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.RuntimeCycleFixtures/bin/Release/net8.0'
          & ./benchmarks/ReflectionTrimProbe.RuntimeCycleFixtures/Build-RuntimeCycleFixtures.ps1 -OutputDirectory $fixtureOutput
          if ($LASTEXITCODE -ne 0) { throw "Real AssemblyRef cycle fixture failed with exit code $LASTEXITCODE" }
      - name: Test NativeAOT warning report classification
        shell: pwsh
        run: ./benchmarks/ReflectionTrimProbe/Test-Check-NativeAotWarnings.ps1
      - name: Build framework-dependent reflection trim analysis
        run: dotnet build benchmarks/ReflectionTrimProbe/ReflectionTrimProbe.csproj -c Release -f net8.0 -p:TargetFrameworks=net8.0 -p:EnableTrimAnalyzer=true -p:TrimMode=partial -p:DebugType=None
      - name: Execute framework-dependent reflection contract probe
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/ReflectionTrimProbe.dll'
          if (!(Test-Path -LiteralPath $probe)) { throw "Framework-dependent reflection probe was not built: $probe" }
          $probeOutput = @(& dotnet $probe 2>&1)
          $exitCode = $LASTEXITCODE
          $probeOutput | Write-Output
          if ($exitCode -ne 0) { throw "Framework-dependent reflection probe failed with exit code $exitCode" }
          if (-not ($probeOutput -contains 'reflection-trim-byref-signature-ok')) {
            throw 'Framework-dependent reflection probe did not emit the by-ref signature marker.'
          }
          if (-not ($probeOutput -contains 'reflection-trim-ref-return-ok')) {
            throw 'Framework-dependent reflection probe did not emit the ref-return marker.'
          }
          if (-not ($probeOutput -contains 'reflection-trim-generic-variance-ok')) {
            throw 'Framework-dependent reflection probe did not emit the generic variance marker.'
          }
      - name: Stage unrooted plugin for framework boundary
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.UnrootedModels/bin/Release/net8.0/ReflectionTrimProbe.UnrootedModels.dll'
          $targetDirectory = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0'
          if (!(Test-Path -LiteralPath $source)) { throw "Unrooted plugin model was not built: $source" }
          Copy-Item -LiteralPath $source -Destination $targetDirectory -Force
      - name: Execute framework-dependent plugin load boundary
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimPluginLoadProbe/bin/Release/net8.0/ReflectionTrimPluginLoadProbe.dll'
          $target = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0'
          if (!(Test-Path -LiteralPath $probe)) { throw "Plugin load probe was not built: $probe" }
          & dotnet $probe $target
          if ($LASTEXITCODE -ne 0) { throw "Framework-dependent plugin load boundary failed with exit code $LASTEXITCODE" }
      - name: Stage non-trimmable third-party plugin on framework host
        shell: pwsh
        run: |
           $plugin = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginModels/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginModels.dll'
           $dependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependency/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginDependency.dll'
           $transitiveDependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency.dll'
           $hostAssemblyPath = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/ReflectionTrimProbe.dll'
           $target = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin'
           & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependency, $transitiveDependency) -OutputDirectory $target
      - name: Execute non-trimmable third-party plugin on framework host
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimThirdPartyPluginProbe/bin/Release/net8.0/ReflectionTrimThirdPartyPluginProbe.dll'
          $target = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin'
          & dotnet $probe $target metadata-preserved
          if ($LASTEXITCODE -ne 0) { throw "Non-trimmable third-party plugin on framework host failed with exit code $LASTEXITCODE" }
      - name: Verify missing transitive dependency on framework host
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimThirdPartyPluginProbe/bin/Release/net8.0/ReflectionTrimThirdPartyPluginProbe.dll'
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginModels/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginModels.dll'
          $dependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependency/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginDependency.dll'
          $hostAssemblyPath = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/ReflectionTrimProbe.dll'
          $target = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-missing-transitive'
          & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath $dependency -OutputDirectory $target
          & dotnet $probe $target member-trimmed
          if ($LASTEXITCODE -ne 0) { throw "Missing transitive dependency boundary failed with exit code $LASTEXITCODE" }
      - name: Stage version-conflicting third-party plugin on framework host
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginModels/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginModels.dll'
          $dependencyV2 = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependencyV2/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginDependency.dll'
          $hostAssemblyPath = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/ReflectionTrimProbe.dll'
          $target = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-version-conflict'
          & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath $dependencyV2 -OutputDirectory $target
      - name: Execute version-conflicting third-party plugin on framework host
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimThirdPartyPluginProbe/bin/Release/net8.0/ReflectionTrimThirdPartyPluginProbe.dll'
          $target = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-version-conflict'
          & dotnet $probe $target metadata-preserved version-conflict-v2
          if ($LASTEXITCODE -ne 0) { throw "Version-conflicting third-party plugin on framework host failed with exit code $LASTEXITCODE" }
      - name: Stage strong-name conflicting third-party plugin on framework host
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.StrongNameConflictModels/bin/Release/net8.0/ReflectionTrimProbe.StrongNameConflictModels.dll'
          $dependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.StrongNameConflictDependency/bin/Release/net8.0/System.Text.Json.dll'
          $hostAssemblyPath = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/ReflectionTrimProbe.dll'
          $target = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-strong-name-conflict'
          & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath $dependency -OutputDirectory $target
      - name: Execute strong-name conflicting third-party plugin on framework host
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimThirdPartyPluginProbe/bin/Release/net8.0/ReflectionTrimThirdPartyPluginProbe.dll'
          $target = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-strong-name-conflict'
          & dotnet $probe $target metadata-preserved strong-name-conflict
          if ($LASTEXITCODE -ne 0) { throw "Strong-name conflicting third-party plugin on framework host failed with exit code $LASTEXITCODE" }
      - name: Stage concurrent third-party plugin dependency matrix on framework host
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginModels/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginModels.dll'
          $diamondPlugin = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDiamondModels/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginModels.dll'
          $tripleDiamondPlugin = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTripleDiamondModels/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginModels.dll'
          $dependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependency/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginDependency.dll'
          $secondaryDependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginSecondaryDependency/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginSecondaryDependency.dll'
          $dependencyVariant = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependencyVariant/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginDependency.dll'
          $transitiveDependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency.dll'
          $transitiveDependencyVariant = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependencyVariant/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency.dll'
          $deepTransitiveDependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDeepTransitiveDependencyVariant/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginTransitiveDependency.dll'
          $deepDependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDeepDependency/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginDeepDependency.dll'
          $tertiaryDependency = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginTertiaryDependency/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginTertiaryDependency.dll'
          $dependencyV2 = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe.NonTrimmablePluginDependencyV2/bin/Release/net8.0/ReflectionTrimProbe.NonTrimmablePluginDependency.dll'
          $hostAssemblyPath = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/ReflectionTrimProbe.dll'
          $firstTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-multi-version-v1'
          $secondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-multi-version-v2'
          $duplicateTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-multi-version-v1-variant'
          $directVariantTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-multi-version-v1-direct-variant'
          $diamondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-multi-version-diamond'
          $mixedVariantTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-multi-version-mixed-variant'
          $deepDiamondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-multi-version-deep-diamond'
          $wideDeepDiamondTarget = Join-Path $env:GITHUB_WORKSPACE 'benchmarks/ReflectionTrimProbe/bin/Release/net8.0/third-party-plugin-multi-version-wide-deep-diamond'
          & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath @($dependency, $transitiveDependency) -OutputDirectory $firstTarget
          & ./benchmarks/ReflectionTrimPluginLoadProbe/Stage-ExternalPlugin.ps1 -PluginAssemblyPath $plugin -HostAssemblyPath $hostAssemblyPath -AdditionalAssemblyPath $dependencyV2 -OutputDirectory $secondTarget

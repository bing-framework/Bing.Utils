          $output = & dotnet publish benchmarks/ReflectionTrimProbe/ReflectionTrimProbe.csproj -c Release -f net8.0 -r win-x64 --self-contained true -p:TargetFrameworks=net8.0 -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=partial -p:DebugType=portable --no-restore "-p:PublishDir=$publishDir/" 2>&1

name: One time password
on:
  pull_request:
    paths: ['src/Bing.Utils.OneTimePassword*/**', 'src/Bing.Utils.Security/**', 'tests/Bing.Utils.OneTimePassword*/**', 'samples/OtpWeb/**', 'build/Test-OneTimePassword.ps1', 'build/OtpPackageConsumer/**', 'Bing.Utils.sln', 'common.props', 'common.tests.props', '.github/workflows/one-time-password.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modules:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.428
            7.0.410
            8.0.425
      - name: Unit on net6 net7 net8
        shell: pwsh
        run: ./build/Test-OneTimePassword.ps1 -Stage Unit
      - name: SQLite Data Protection and Web
        shell: pwsh
        run: ./build/Test-OneTimePassword.ps1 -Stage Integration
      - name: Pack all frameworks and consume
        shell: pwsh
        run: ./build/Test-OneTimePassword.ps1 -Stage PackConsumer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otp-${{ matrix.os }}
          path: |
            output/otp-validation/**/results.json
            output/otp-validation/**/commands.log
            output/otp-validation/**/*.trx
  redis:
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:8.6
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BING_OTP_REDIS: 127.0.0.1:6379,abortConnect=true,connectTimeout=3000,syncTimeout=3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - name: Real Redis concurrency and expiry
        run: dotnet test tests/Bing.Utils.OneTimePassword.Redis.Tests.Integration -c Release -m:1 --logger trx --results-directory output/otp-redis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otp-redis
          path: output/otp-redis/*.trx

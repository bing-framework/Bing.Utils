<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片文字识别</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main>
<header><p class="eyebrow">BING UTILS · OCR</p><h1>把图片，变成文字。</h1><p>上传中英文图片，选择识别区域，在原图中核对结果。</p></header>
<section class="toolbar" aria-label="图片和识别选项">
<label class="upload">选择图片<input id="file" type="file" accept="image/png,image/jpeg,image/bmp,.bmp"></label>
<label>预处理<select id="preset"><option value="Standard">标准 · 保留彩色</option><option value="Scan">扫描件 · 灰度</option></select></label>
<label>顺时针旋转<select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label>
<button id="recognize" class="primary" disabled>识别文字</button><button id="cancel" disabled>取消</button>
</section>
<p id="status" role="status" aria-live="polite">支持 PNG、JPEG、BMP，单张不超过 10 MiB。</p>
<div class="workspace">
<section class="panel"><div class="panel-title"><h2>图片预览</h2><button id="whole" type="button">使用整张图片</button></div>
<div id="drop" class="preview"><p id="empty">将图片拖到这里，或点击「选择图片」</p><canvas id="canvas" hidden aria-label="图片预览，可拖动选择识别区域"></canvas></div>
<fieldset><legend>识别区域（可拖动框选，也可输入坐标）</legend><div class="region">
<label>X<input id="x" type="number" min="0" value="0"></label><label>Y<input id="y" type="number" min="0" value="0"></label>
<label>宽<input id="width" type="number" min="1"></label><label>高<input id="height" type="number" min="1"></label></div></fieldset>
<p class="hint">蓝框为识别结果，橙框表示较低置信度。请核对关键文字。</p></section>
<section class="panel"><div class="panel-title"><h2>识别文字</h2><span id="count"></span></div>
<label for="edited" class="hint">可编辑文字</label><textarea id="edited" placeholder="识别完成后，文字会出现在这里。" spellcheck="false"></textarea>
<div class="actions"><button id="copy" disabled>复制文字</button><button id="txt" disabled>下载 TXT</button><button id="json" disabled>下载 JSON</button></div>
<details><summary>查看识别原文</summary><pre id="original"></pre></details>
<details><summary>查看逐行结果</summary><ol id="lines"></ol></details>
</section></div>
<footer>图片由配置的识别服务处理；此示例不保存上传文件。</footer>
</main><script type="module" src="/app.js"></script>
</body></html>
